[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[project]
name = "mcp_server"
version = "0.1.0"
description = "Finance Agent MCP server — exposes all skills as tools via SSE transport"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "uvicorn[standard]>=0.30",
    "starlette>=0.40",
    "common",
]

[tool.uv.sources]
common = { workspace = true }
