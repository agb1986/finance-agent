[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/check_crypto"]

[project]
name = "check-crypto"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "pycoingecko>=3.1.0",
    "mplfinance>=0.12.10b0",
    "nbformat>=5.10.4",
    "plotext>=5.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
