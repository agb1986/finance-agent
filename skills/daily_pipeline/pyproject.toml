[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_pipeline"]

[project]
name = "daily-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "anthropic>=0.40",
    "markdown>=3.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
