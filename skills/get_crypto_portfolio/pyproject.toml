[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/get_crypto_portfolio"]

[project]
name = "get-crypto-portfolio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
