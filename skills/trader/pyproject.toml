[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "common",
    "tradingagents>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
