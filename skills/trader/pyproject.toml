[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92",
    "common",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
]
