[project]
name = "financial-news"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "feedparser>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_news"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
