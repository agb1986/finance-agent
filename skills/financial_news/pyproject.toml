[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_news"]

[project]
name = "financial-news"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "common",
    "feedparser>=6.0.12",
    "sentence-transformers>=5.3.0",
    "torch>=2.10",
]

# torch is only ever a transitive dep of sentence-transformers, but uv sources
# bind direct dependencies only — so declare it here to force the CPU-only
# wheel and keep the ~6.5GB of CUDA/triton wheels out of the image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
