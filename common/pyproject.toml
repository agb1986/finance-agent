[project]
name = "common"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]

[dependency-groups]
dev = ["pytest>=9.0", "pytest-cov>=7.0"]
