[project]
name = "finance-agent"
version = "0.1.0"
description = "Personal finance agent powered by Claude skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["common", "skills/*", "mcp_server"]

# sentence-transformers (financial_news) pulls in torch, which defaults to the
# CUDA build — ~6.5GB of nvidia/triton wheels. Nothing here uses a GPU and the
# deployment target is a headless CasaOS box, so financial_news pins torch to
# this CPU-only index (see skills/financial_news/pyproject.toml).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["skills", "common/tests"]
python_files = ["test_*.py"]
addopts = "--cov --cov-fail-under=85 --cov-report=term-missing --import-mode=importlib"

[tool.coverage.run]
source = ["skills", "common/src"]

[tool.coverage.report]
omit = ["*/test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — formatter handles this
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
